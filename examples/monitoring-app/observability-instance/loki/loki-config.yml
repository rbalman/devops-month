# Minimal single-binary Loki: no auth, filesystem storage, in-memory ring. Good
# for a lab or single host — not for production (which shards these components).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  # /tmp is world-writable, so Loki's non-root user (uid 10001) can create these
  # dirs. Pointing at /loki fails with "permission denied" on this image.
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h # 7 days
