name: Deploy Infra

# Stage 1 of the deploy: provision/update the AWS infra for an environment.
# Run this before building images (it creates ECR) and before deploying.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to provision
        type: choice
        options: [dev, prod]
        default: dev
        required: true

permissions:
  id-token: write # OIDC → AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    # Picking prod trips its GitHub Environment's required-reviewer gate.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      # Infra only — DB credentials are handled at deploy time by Ansible, not here.
      - name: Terraform apply
        run: |
          cd "terraform/envs/$TARGET_ENV"
          terraform init -input=false
          terraform apply -auto-approve -input=false
