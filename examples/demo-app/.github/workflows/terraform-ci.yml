name: Terraform CI

# Only runs when Terraform changes. validate is offline (no creds); plan runs on
# PRs so the diff is reviewable before merge. apply lives in deploy-infra.yml.
on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches-ignore: [main]
    paths: ["terraform/**"]

permissions:
  id-token: write # OIDC, for the plan job
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform plan -no-color -input=false
