name: Deploy App

# Stage 3 of the deploy: deploy the app containers with Ansible, over SSH.
# Prerequisites: the infra exists (Infra workflow) and the images are in ECR
# (backend-ci / frontend-ci).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      image_tag:
        description: Image tag to deploy
        type: string
        required: false
        default: latest

permissions:
  id-token: write # OIDC → AWS (SSM lookup + dynamic inventory)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Picking prod trips its GitHub Environment's required-reviewer gate.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve the ECR registry
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_REGISTRY=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write the SSH private key
        run: |
          install -m 600 /dev/null key.pem
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem

      - name: Ansible deploy
        working-directory: ansible
        run: |
          ansible-playbook -i "inventory/${TARGET_ENV}.aws_ec2.yml" site.yml \
            --private-key ../key.pem \
            -e env_name="$TARGET_ENV" \
            -e ecr_registry="$ECR_REGISTRY" \
            -e image_tag="$IMAGE_TAG"
