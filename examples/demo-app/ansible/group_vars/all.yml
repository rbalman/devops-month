---
# Every deploy input comes from the ENVIRONMENT — the deploy-app.yml workflow sets
# these (from repo variables + secrets). The defaults let you run locally by
# exporting the same variables. One consistent mechanism, no mixed `-e` flags.
env_name: "{{ lookup('env', 'ENV_NAME') | default('dev', true) }}"
aws_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"

# --- Reach the instances over SSH (they have public IPs) --------------------
# The private key is supplied by the deploy pipeline (--private-key); host key
# checking is disabled in ansible.cfg because runner IPs are dynamic.
ansible_user: ubuntu
ansible_python_interpreter: /usr/bin/python3

# --- Images to deploy -------------------------------------------------------
image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
ecr_registry: "{{ lookup('env', 'ECR_REGISTRY') }}"
backend_image: "{{ ecr_registry }}/demo-app-{{ env_name }}-backend:{{ image_tag }}"
frontend_image: "{{ ecr_registry }}/demo-app-{{ env_name }}-frontend:{{ image_tag }}"

# --- DB credentials — straight from GitHub secrets via the environment -------
db_name: appdb
db_username: "{{ lookup('env', 'DB_USERNAME') }}"
db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
