[defaults]
host_key_checking = False
# YAML-formatted task output. (The old `stdout_callback = yaml` was removed from
# community.general 12.0 — this is the built-in replacement.)
result_format = yaml
roles_path = roles
# No default inventory: pass -i inventory/dev.aws_ec2.yml or prod.aws_ec2.yml so
# dev and prod (same account/region) never mix.

[inventory]
enable_plugins = amazon.aws.aws_ec2
