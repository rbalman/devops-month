---
# Which environment we're deploying. CD overrides with -e env_name=prod.
env_name: dev
aws_region: us-east-1

# --- Reach the private instances over SSM Session Manager (no SSH) -----------
ansible_connection: amazon.aws.aws_ssm
ansible_aws_ssm_region: "{{ aws_region }}"
# S3 bucket the SSM connection plugin uses to shuttle files to the host.
# Reuse the Terraform state bucket or a dedicated one (see README prereqs).
ansible_aws_ssm_bucket_name: "golive-tf-state-CHANGEME"
ansible_python_interpreter: /usr/bin/python3

# --- Images to deploy. CD passes real values via -e (ecr_registry, image_tag) -
image_tag: latest
ecr_registry: "CHANGEME.dkr.ecr.us-east-1.amazonaws.com"
backend_image: "{{ ecr_registry }}/end-to-end-{{ env_name }}-backend:{{ image_tag }}"
frontend_image: "{{ ecr_registry }}/end-to-end-{{ env_name }}-frontend:{{ image_tag }}"

# --- DB credentials, read from SSM Parameter Store (on the controller) --------
# These evaluate lazily where referenced; the runner's OIDC creds read them.
db_username: "{{ lookup('amazon.aws.aws_ssm', '/end-to-end/' ~ env_name ~ '/db/username', region=aws_region) }}"
db_password: "{{ lookup('amazon.aws.aws_ssm', '/end-to-end/' ~ env_name ~ '/db/password', region=aws_region, decrypt=True) }}"
db_name: "{{ lookup('amazon.aws.aws_ssm', '/end-to-end/' ~ env_name ~ '/db/name', region=aws_region) }}"
