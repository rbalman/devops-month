---
- name: Install Docker engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Ensure Docker is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install the AWS CLI (used for ECR login on the instance)
  ansible.builtin.command: snap install aws-cli --classic
  args:
    creates: /snap/bin/aws
