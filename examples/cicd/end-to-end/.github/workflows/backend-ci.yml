name: Backend CI

# Only runs when backend code changes (and never on main — main is CD's job).
on:
  pull_request:
    paths: ["backend/**"]
  push:
    branches-ignore: [main]
    paths: ["backend/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Prove the image builds — but do NOT push here. Pushing happens only on
      # merge to main, in cd.yml.
      - run: docker build -t backend:ci .
