# Frontend nginx: serve the static UI and reverse-proxy /api/ to the backend.
# The upstream name "backend" resolves on the shared docker-compose network —
# identical locally and on the EC2 app instances (both run this compose stack).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static files (falls back to index.html so the SPA loads on any path).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Anything under /api/ goes to the Node backend.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
