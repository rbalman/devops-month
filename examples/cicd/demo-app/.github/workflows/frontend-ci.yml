name: Frontend

# Two responsibilities in one file, split by trigger:
#   • ci         — build + validate nginx on every PR touching frontend/**
#   • build-push — build the image and push it to ECR (keyless, via OIDC) when a
#                  frontend change is merged to main, or on manual dispatch
on:
  pull_request:
    paths: ["frontend/**"]
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC → AWS (build-push)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: demo-app-dev-frontend # the repo Terraform created

jobs:
  ci:
    # Validation only — runs on PRs, never pushes an image.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Build the image (validates the Dockerfile + that the static files copy in)…
      - run: docker build -t frontend:ci .
      # …and check the nginx config is valid.
      - name: Validate nginx config
        run: docker run --rm frontend:ci nginx -t

  build-push:
    # Ship the image: only on merge to main (frontend/** changed) or manual run.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
