---
# Which environment we're deploying. CD overrides with -e env_name=prod.
env_name: dev
aws_region: us-east-1

# --- Reach the instances over SSH (they have public IPs) --------------------
# The private key is supplied by the deploy pipeline (--private-key); host key
# checking is disabled in ansible.cfg because runner IPs are dynamic.
ansible_user: ubuntu
ansible_python_interpreter: /usr/bin/python3

# --- Images to deploy. CD passes real values via -e (ecr_registry, image_tag) -
image_tag: latest
ecr_registry: "CHANGEME.dkr.ecr.us-east-1.amazonaws.com"
backend_image: "{{ ecr_registry }}/demo-app-{{ env_name }}-backend:{{ image_tag }}"
frontend_image: "{{ ecr_registry }}/demo-app-{{ env_name }}-frontend:{{ image_tag }}"

# --- DB credentials, read from SSM Parameter Store (on the controller) --------
# These evaluate lazily where referenced; the runner's OIDC creds read them.
db_username: "{{ lookup('amazon.aws.aws_ssm', '/demo-app/' ~ env_name ~ '/db/username', region=aws_region) }}"
db_password: "{{ lookup('amazon.aws.aws_ssm', '/demo-app/' ~ env_name ~ '/db/password', region=aws_region, decrypt=True) }}"
db_name: "{{ lookup('amazon.aws.aws_ssm', '/demo-app/' ~ env_name ~ '/db/name', region=aws_region) }}"
